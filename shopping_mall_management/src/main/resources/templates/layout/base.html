<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title + ' - Nexus Mall Management'}">Shopping Mall Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Modern Stylesheet -->
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-mall" th:fragment="navbar">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-buildings-fill text-warning fs-4"></i>
                <span class="fw-bold tracking-tight">NexusMall</span>
                <span class="navbar-brand-badge text-xs">SMMS Enterprise</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
                    <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                        <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Admin Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ROLE_OFFICER')">
                        <a class="nav-link" th:href="@{/officer/dashboard}"><i class="bi bi-shield-check me-1"></i> Floor Inspections</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ROLE_TENANT')">
                        <a class="nav-link" th:href="@{/tenant/dashboard}"><i class="bi bi-shop me-1"></i> My Tenant Portal</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <div class="text-light text-end d-none d-md-block" sec:authorize="isAuthenticated()">
                        <div class="fw-semibold small" sec:authentication="name">User</div>
                        <div class="text-white-50" style="font-size: 0.75rem;" sec:authentication="principal.authorities">ROLE</div>
                    </div>
                    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                        <button type="submit" class="btn btn-outline-light btn-sm px-3 rounded-pill">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                    <a th:href="@{/login}" class="btn btn-warning btn-sm px-3 fw-bold rounded-pill" sec:authorize="!isAuthenticated()">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Footer Fragment -->
    <footer class="footer mt-auto" th:fragment="footer">
        <div class="container text-center">
            <p class="mb-0 text-muted">
                &copy; 2026 <strong>Nexus Grand Galleria Mall</strong> Management System &bull; BCA Final-Year Project
            </p>
            <small class="text-muted">Built with Java 17, Spring Boot 3.x, Spring Data JPA, Spring Security &amp; Thymeleaf</small>
        </div>
        <!-- Bootstrap 5 Bundle JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
