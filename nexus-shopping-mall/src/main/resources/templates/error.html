<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Error')}">
    <title>Error - Shopping Mall Management System</title>
</head>
<body class="bg-light">

    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-5 text-center">
        <div class="card-panel mx-auto p-5" style="max-width: 580px;">
            <div class="mb-4 text-warning">
                <i class="bi bi-shield-exclamation display-1"></i>
            </div>
            <h2 class="fw-bold text-dark mb-2">Notice / Operation Error</h2>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected application condition occurred. The system safely caught this exception to maintain data integrity.'}">
                An unexpected application condition occurred.
            </p>

            <div th:if="${status != null}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2 mb-4">
                HTTP Status: <span th:text="${status}">500</span>
            </div>

            <div>
                <a th:href="@{/}" class="btn btn-primary px-4 py-2 fw-semibold">
                    <i class="bi bi-house-door me-1"></i> Return to Main Portal
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

</body>
</html>
