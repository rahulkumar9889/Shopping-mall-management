<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Sign In')}">
    <title>Sign In - Shopping Mall Management System</title>
</head>
<body class="bg-light">

    <!-- Top Minimal Header -->
    <header class="py-3 px-4 border-bottom bg-white">
        <div class="container d-flex align-items-center justify-content-between">
            <a th:href="@{/}" href="/" class="d-flex align-items-center gap-2 text-decoration-none">
                <i class="bi bi-buildings-fill text-primary fs-3"></i>
                <span class="fs-5 fw-bold text-dark">NexusMall SMMS</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/}" href="/" class="btn btn-outline-secondary btn-sm px-3 rounded-pill">
                    <i class="bi bi-arrow-left me-1"></i> Public Mall Site
                </a>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill d-none d-sm-inline">
                    BCA Final Year Standard
                </span>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="login-container">
            <div class="login-card shadow-sm">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-3">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Mall Portal Login</h3>
                    <p class="text-muted small">Sign in to access your administrative, officer, or tenant dashboard</p>
                </div>

                <!-- Error & Success Messages -->
                <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 small py-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <div>Invalid username or password. Please verify your credentials.</div>
                </div>
                <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 small py-2" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <div>You have been safely signed out.</div>
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. admin or officer1" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                    </button>
                </form>

                <!-- Quick-Fill Credentials Box (For BCA Examiners / Evaluators) -->
                <div class="quick-cred-box mt-3">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="fw-bold text-dark"><i class="bi bi-info-circle text-primary me-1"></i> Evaluation Test Logins:</span>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('admin', 'admin123')">
                            <span class="badge bg-danger me-1">ADMIN</span> <strong>admin</strong> / <code>admin123</code>
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('officer1', 'officer123')">
                            <span class="badge bg-primary me-1">OFFICER</span> <strong>officer1</strong> (Floor 2) / <code>officer123</code>
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('tenant1', 'tenant123')">
                            <span class="badge bg-success me-1">TENANT</span> <strong>tenant1</strong> (Shop 101) / <code>tenant123</code>
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('tenant2', 'tenant123')">
                            <span class="badge bg-success me-1">TENANT</span> <strong>tenant2</strong> (Shop 204) / <code>tenant123</code>
                        </button>
                    </div>

                    <div class="text-center mt-3 pt-3 border-top">
                        <a th:href="@{/}" href="/" class="text-decoration-none small text-muted">
                            <i class="bi bi-buildings text-primary me-1"></i> Return to Public Mall Homepage
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }
    </script>
</body>
</html>
