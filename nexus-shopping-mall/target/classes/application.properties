# ===================================================================
# Shopping Mall Management System - Configuration (Spring Boot 3.x)
# BCA Academic Final-Year Project
# ===================================================================

spring.application.name=Shopping Mall Management System
server.port=8080

# -------------------------------------------------------------------
# Primary Database Configuration: H2 In-Memory (Zero Setup Fallback)
# Ensures application boots seamlessly in any local evaluation setup
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:malldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Database Initialization: Handled cleanly by DataInitializer component
# -------------------------------------------------------------------
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Optional: MySQL 8.x Configuration (Uncomment when MySQL is active)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/mall_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root123

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Thymeleaf Template Engine Settings
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Logging Levels
# -------------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.mall=DEBUG
